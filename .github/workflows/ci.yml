# Minimal CI: static checks, unit tests, PostgreSQL integration tests and migrations.
# Needs no Anthropic API key and no SMTP credentials: every external provider is faked in tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Disposable, job-scoped PostgreSQL. The credentials below are throwaway test values for this
      # service container only (not secrets). The test database itself is created and marked by
      # the test setup's safety guard (test/support/test-database-guard.ts).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pm_ci
          POSTGRES_PASSWORD: pm_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://pm_ci:pm_ci_disposable@localhost:5432/papermorning_test
      CI_MIGRATION_DATABASE_URL: postgres://pm_ci:pm_ci_disposable@localhost:5432/papermorning_migrate_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for PDF tests (only when the PDF module is present)
        run: |
          if [ -d node_modules/playwright ]; then
            npx playwright install --with-deps --only-shell chromium
            # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor, which Chromium's
            # sandbox needs ("No usable sandbox!"). Lift it on this throwaway runner so the tests
            # keep running with the sandbox ON (the production default outside Docker).
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "playwright not installed on this branch; skipping"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: All tests (unit + PostgreSQL integration, module-init, e2e)
        run: npm test

      - name: Migrations apply to an empty database via the production CLI path
        run: |
          node -e "
            const { Client } = require('pg');
            const url = new URL(process.env.CI_MIGRATION_DATABASE_URL);
            const name = url.pathname.slice(1);
            url.pathname = '/postgres';
            const c = new Client({ connectionString: url.toString() });
            c.connect()
              .then(() => c.query('CREATE DATABASE \"' + name + '\"'))
              .then(() => c.end());
          "
          DATABASE_URL="$CI_MIGRATION_DATABASE_URL" npm run migration:run
          DATABASE_URL="$CI_MIGRATION_DATABASE_URL" npm run migration:show
