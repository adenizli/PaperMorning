# Minimal CI: static checks, unit tests, PostgreSQL integration tests and migrations.
# Needs no Anthropic API key and no SMTP credentials: every external provider is faked in tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Disposable, job-scoped PostgreSQL. The credentials below are throwaway test values for this
      # service container only (not secrets). The test database itself is created and marked by
      # the test setup's safety guard (test/support/test-database-guard.ts).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pm_ci
          POSTGRES_PASSWORD: pm_ci_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Disposable development mail sink (same pinned image as docker-compose.yml); the delivery
      # test sends real SMTP to it and verifies the PDF attachment through its API.
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      TEST_DATABASE_URL: postgres://pm_ci:pm_ci_disposable@localhost:5432/papermorning_test
      MAILPIT_API_URL: http://localhost:8025
      MAILPIT_SMTP_PORT: '1025'
      CI_MIGRATION_DATABASE_URL: postgres://pm_ci:pm_ci_disposable@localhost:5432/papermorning_migrate_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for PDF tests (only when the PDF module is present)
        run: |
          if [ -d node_modules/playwright ]; then
            npx playwright install --with-deps --only-shell chromium
            # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor, which Chromium's
            # sandbox needs ("No usable sandbox!"). Lift it on this throwaway runner so the tests
            # keep running with the sandbox ON (the production default outside Docker).
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "playwright not installed on this branch; skipping"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: All tests (unit + PostgreSQL integration, module-init, e2e)
        run: npm test

      - name: Migrations apply to an empty database via the production CLI path
        run: |
          node -e "
            const { Client } = require('pg');
            const url = new URL(process.env.CI_MIGRATION_DATABASE_URL);
            const name = url.pathname.slice(1);
            url.pathname = '/postgres';
            const c = new Client({ connectionString: url.toString() });
            c.connect()
              .then(() => c.query('CREATE DATABASE \"' + name + '\"'))
              .then(() => c.end());
          "
          DATABASE_URL="$CI_MIGRATION_DATABASE_URL" npm run migration:run
          DATABASE_URL="$CI_MIGRATION_DATABASE_URL" npm run migration:show

  # The production image under the same hardening as docker-compose.yml (non-root, read-only root
  # filesystem, all capabilities dropped, no-new-privileges, noexec /tmp). Reproduces the production
  # failure "Chromium sandboxing failed!": a host-style .env with PDF_CHROMIUM_SANDBOX=true must not
  # reach the container. Needs no database, no Claude key and no SMTP.
  container-pdf-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Host-style .env (throwaway values for this runner only)
        run: |
          {
            echo "NODE_ENV=production"
            echo "POSTGRES_PASSWORD=ci-disposable-not-a-secret"
            echo "JWT_SECRET=ci-only-jwt-secret-not-used-anywhere-0123456789"
            echo "PDF_CHROMIUM_SANDBOX=true"
            echo "SCHEDULER_ENABLED=false"
            echo "MAIL_ENABLED=false"
          } > .env

      - name: Build the production image
        run: docker compose build server

      - name: PDF smoke test inside the hardened container
        run: |
          docker compose run --rm --no-deps -T server node dist/bootstrap/cli.js pdf:smoke --out - > smoke.pdf
          head -c 5 smoke.pdf | grep -q '%PDF-'
          ls -l smoke.pdf

      - name: An explicit PDF_CHROMIUM_SANDBOX=true inside the container is refused at startup
        run: |
          set +e
          docker compose run --rm --no-deps -T -e PDF_CHROMIUM_SANDBOX=true server \
            node dist/bootstrap/cli.js pdf:smoke > refused.json
          code=$?
          set -e
          cat refused.json
          test "$code" -eq 1
          grep -q 'PDF_CHROMIUM_SANDBOX=true cannot work inside the PaperMorning container' refused.json
