# Local/self-hosted PostgreSQL for PaperMorning. Data persists in the named volume.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papermorning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-papermorning}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is "postgres".
      DATABASE_URL: postgres://${POSTGRES_USER:-papermorning}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-papermorning}
      DATA_DIR: /data
      PORT: '3000'
      # See README: inside an unprivileged container Chromium's own sandbox cannot start;
      # the container (non-root, no extra capabilities, JS off, all network blocked) is the boundary.
      PDF_CHROMIUM_SANDBOX: ${PDF_CHROMIUM_SANDBOX:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SERVER_PORT:-3000}:3000'
    volumes:
      - papermorning-data:/data

volumes:
  postgres-data:
  # Private PDF archive. Back it up together with the database.
  papermorning-data:
