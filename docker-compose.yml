# Local/self-hosted PostgreSQL for PaperMorning. Data persists in the named volume.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papermorning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-papermorning}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is "postgres".
      DATABASE_URL: postgres://${POSTGRES_USER:-papermorning}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-papermorning}
      DATA_DIR: /data
      PORT: '3000'
      # Fixed value, deliberately NOT interpolated from .env: a host-oriented
      # PDF_CHROMIUM_SANDBOX=true in .env (env_file above) used to reach the container and break
      # every render ("Chromium sandboxing failed!"). Inside this unprivileged container Chromium's
      # own sandbox cannot start; the hardened container below is the isolation boundary, which is
      # weaker than Chromium's sandbox (see README "Chromium sandbox").
      PDF_CHROMIUM_SANDBOX: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SERVER_PORT:-3000}:3000'
    volumes:
      - papermorning-data:/data
    # Hardening for the in-container Chromium (verified to still render; see README):
    user: node
    init: true # reaps orphaned Chromium processes
    read_only: true # only /data (volume) and /tmp (tmpfs) are writable
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    memswap_limit: 1536m

  # Optional local mail sink for demos/tests only (not started by default):
  #   docker compose --profile mail-sink up -d mailpit   -> UI on http://127.0.0.1:8025
  #   then set SMTP_HOST=mailpit (inside compose) or 127.0.0.1 with SMTP_PORT=1025, SMTP_SECURE=none,
  #   SMTP_ALLOW_INSECURE=true. Production uses the operator's real SMTP provider.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ['mail-sink']
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
  # Private PDF archive. Back it up together with the database.
  papermorning-data:
